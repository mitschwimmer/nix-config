#  The following snippet will work once the 2026 release of helix is out
#[theme]
#dark = "gruvbox-material"
#light = "gruvbox_light"
theme = "gruvbox"

[editor]
line-number = "relative"
mouse = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[keys.normal]
"C-b" = ":sh javac @cmd/compile && java @cmd/test"
