name: MicroVM foundation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check topology, persistence and host lifecycle settings
        run: |
          nix eval --no-update-lock-file --impure --json --expr '
            import ./tests/microvms.nix { flake = builtins.getFlake (toString ./.); }
          '
      - name: Evaluate installed hosts and guest runners
        run: |
          for host in meablack meablack-secure meawhite meawhite-secure; do
            nix eval --no-update-lock-file --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
          done
          for guest in k8s-cp-01 k8s-cp-02 k8s-cp-03 k8s-worker-02; do
            nix eval --no-update-lock-file --raw ".#nixosConfigurations.$guest.config.microvm.declaredRunner.drvPath"
          done
      - name: Build control-plane and worker runners and guest images
        run: |
          nix build --no-update-lock-file --no-link --print-build-logs \
            .#nixosConfigurations.k8s-cp-01.config.microvm.declaredRunner \
            .#nixosConfigurations.k8s-cp-02.config.microvm.declaredRunner \
            .#nixosConfigurations.k8s-cp-03.config.microvm.declaredRunner \
            .#nixosConfigurations.k8s-worker-02.config.microvm.declaredRunner
