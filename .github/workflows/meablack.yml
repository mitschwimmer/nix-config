name: meablack NixOS build

on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "meablack/**"
      - ".github/workflows/meablack.yml"
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "meablack/**"
      - ".github/workflows/meablack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Validate installer scripts and disk selection
        run: |
          bash -n meablack/build-installer.sh meablack/install.sh meablack/select-disk.sh
          shellcheck -s bash meablack/build-installer.sh meablack/install.sh meablack/select-disk.sh
          python3 meablack/test-select-disk.py
      - name: Evaluate meablack
        run: nix eval --no-update-lock-file --raw .#nixosConfigurations.meablack.config.system.build.toplevel.drvPath
      - name: Build meablack system
        run: nix build --no-update-lock-file --no-link --print-build-logs .#nixosConfigurations.meablack.config.system.build.toplevel
      - name: Build offline installer with a disposable CI passphrase
        env:
          MEABLACK_RECOVERY_PASSPHRASE_FILE: ${{ runner.temp }}/meablack-ci-passphrase
        run: bash meablack/build-installer.sh --print-build-logs
      # Do not publish this image: it contains a passphrase known to the CI runner.
