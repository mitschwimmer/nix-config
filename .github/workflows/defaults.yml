name: Syntax checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syntax-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Parse directly: no flake evaluation, input downloads or builds.
      - name: Parse all tracked Nix files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Parsing $file"
            nix-instantiate --parse "$file" > /dev/null
          done < <(git ls-files -z -- '*.nix')
      - name: Check tracked Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(git ls-files -z -- '*.sh')
      - name: Check lock file JSON
        run: python3 -m json.tool flake.lock > /dev/null
      - name: Check desktop logic
        run: node --test tests/*.test.cjs
