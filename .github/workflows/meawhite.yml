name: meawhite NixOS build

on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "base.nix"
      - "meawhite/**"
      - ".github/workflows/meawhite.yml"
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "base.nix"
      - "meawhite/**"
      - ".github/workflows/meawhite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Validate installer scripts and disk selection
        run: |
          bash -n meawhite/build-installer.sh meawhite/install.sh meawhite/check-disks.sh meawhite/test-check-disks.sh
          shellcheck -s bash meawhite/build-installer.sh meawhite/install.sh meawhite/check-disks.sh meawhite/test-check-disks.sh
          bash meawhite/test-check-disks.sh
          bash -n meawhite/talos/render-cilium.sh
          shellcheck -s bash meawhite/talos/render-cilium.sh
      - name: Evaluate meawhite
        run: nix eval --no-update-lock-file --raw .#nixosConfigurations.meawhite.config.system.build.toplevel.drvPath
      - name: Render and validate Talos Cilium bootstrap
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          nix develop --no-update-lock-file .#meawhite-talos --command bash -euc '
            work="$1"
            umask 077
            mkdir -p "$work/generated"
            bash meawhite/talos/render-cilium.sh "$work/cilium-bootstrap.patch.yaml"
            talosctl gen config meawhite https://192.0.2.10:6443 \
              --talos-version v1.14.5 \
              --install-disk /dev/vda \
              --config-patch-control-plane @meawhite/talos/cilium.patch.yaml \
              --config-patch-control-plane @"$work/cilium-bootstrap.patch.yaml" \
              --config-patch @meawhite/talos/installer.patch.yaml \
              --output-dir "$work/generated"
            talosctl validate --config "$work/generated/controlplane.yaml" --mode metal
            grep -qx "kind: KubeInlineManifestConfig" "$work/generated/controlplane.yaml"
          ' bash "$work"
      - name: Build meawhite system
        run: nix build --no-update-lock-file --no-link --print-build-logs .#nixosConfigurations.meawhite.config.system.build.toplevel
      - name: Build meawhite Secure Boot system
        run: nix build --no-update-lock-file --no-link --print-build-logs .#nixosConfigurations.meawhite-secure.config.system.build.toplevel
      - name: Build offline installer with a disposable CI passphrase
        env:
          MEAWHITE_RECOVERY_PASSPHRASE_FILE: ${{ runner.temp }}/meawhite-ci-passphrase
        run: bash meawhite/build-installer.sh --print-build-logs
      # Do not publish this image: it contains a passphrase known to the CI runner.

